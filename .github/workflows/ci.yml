name: Node.js CI Pipelin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:  
        os: [ubuntu-latest, windows-latest]
        node-version: [20,22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Create test results folder
        run: |
         mkdir -p test-results
         echo "Test 1: PASS" > test-results/results.txt
         echo "<h1>All Tests Passed</h1>" > test-results/report.html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results              # name of the artifact
          path: test-results/ 
          overwrite: true 
