name: Reusable Node Test

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: '20'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm install
      - run: npm test
      - name: Create test results folder
        run: |
          mkdir -p test
          echo "Test 1: pass" > test/result.txt
          echo "<h1>All Tests Passed</h1>" > test/reports.html
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test/
          overwrite: true
